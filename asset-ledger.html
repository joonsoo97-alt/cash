<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>자산장부</title>
<style>
  :root{
    --paper:#EFECE3;
    --paper-deep:#E6E1D3;
    --card:#FBF9F3;
    --line:#CDC5AE;
    --line-soft:#DFD9C7;
    --ink:#1B2A4A;
    --ink-soft:#5A6685;
    --ink-faint:#93998B;
    --seal:#B23A2E;
    --seal-soft:#E7CFC9;
    --mint:#2F6F5E;
    --mint-soft:#D8E6DF;
    --gold:#B5872F;
    --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    height:100%; overscroll-behavior-y:none;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(27,42,74,0.035) 28px);
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

  /* Header */
  header.top{padding:22px 20px 14px;position:sticky;top:0;z-index:20;
    background:var(--paper);border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:baseline;justify-content:space-between;}
  .brand h1{font-size:21px;margin:0;letter-spacing:0.5px;font-weight:800;}
  .brand h1 small{display:block;font-size:10px;font-weight:600;letter-spacing:2.5px;
    color:var(--ink-faint);text-transform:uppercase;margin-bottom:3px;}
  .profile-chip{display:flex;align-items:center;gap:6px;background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px;font-weight:700;cursor:pointer;}
  .profile-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--seal);}

  main{flex:1;padding:16px 16px 100px;}
  .tab{display:none;}
  .tab.active{display:block;animation:fadeIn .22s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;}
  .card-title{font-size:12px;font-weight:700;color:var(--ink-faint);letter-spacing:1.5px;
    text-transform:uppercase;margin:0 0 10px;}

  /* Home dashboard */
  .empty{text-align:center;padding:48px 20px;color:var(--ink-soft);}
  .empty .seal-mark{width:52px;height:52px;border:2px solid var(--seal);border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--seal);
    font-weight:800;font-size:20px;transform:rotate(-8deg);}
  .empty h3{color:var(--ink);margin:0 0 6px;font-size:16px;}
  .empty p{font-size:13.5px;line-height:1.6;margin:0 0 18px;}

  .month-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    color:var(--ink-soft);margin-bottom:10px;}
  .month-badge .stamp{width:18px;height:18px;border:1.5px solid var(--seal);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--seal);font-size:9px;transform:rotate(-8deg);}

  .owner-row{display:flex;gap:10px;margin-bottom:12px;}
  .owner-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 14px 12px;}
  .owner-card.total{background:var(--ink);color:#fff;border-color:var(--ink);}
  .owner-card .oname{font-size:12px;font-weight:700;letter-spacing:0.5px;margin-bottom:8px;
    display:flex;align-items:center;gap:5px;}
  .owner-card.total .oname{color:#D8DCE8;}
  .owner-card .amt{font-size:20px;font-weight:800;line-height:1.2;}
  .owner-card .sub{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);
    margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-soft);}
  .owner-card.total .sub{color:#9AA3BE;border-top-color:#3A4666;}
  .delta{font-size:12px;font-weight:700;margin-top:6px;}
  .delta.up{color:var(--mint);}
  .delta.down{color:var(--seal);}
  .delta.flat{color:var(--ink-faint);}

  .avail-bar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-top:10px;background:var(--line-soft);}
  .avail-bar .a{background:var(--mint);}
  .avail-bar .b{background:var(--gold);}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .legend span{display:flex;align-items:center;gap:4px;}
  .legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}

  .goal-card{margin-bottom:12px;}
  .goal-bar{height:10px;border-radius:6px;background:var(--line-soft);overflow:hidden;margin:10px 0 6px;}
  .goal-bar .fill{height:100%;background:var(--mint);border-radius:6px;transition:width .3s;}
  .goal-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .goal-pct{font-size:13px;font-weight:800;color:var(--mint);}

  .reminder-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--seal-soft);border:1px solid var(--seal);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
  .reminder-banner p{margin:0;font-size:12.5px;font-weight:700;color:var(--seal);line-height:1.4;}
  .reminder-banner button{flex-shrink:0;}

  .donut-wrap{display:flex;align-items:center;gap:16px;}
  canvas#donutChart{width:110px;height:110px;flex-shrink:0;}
  .donut-legend{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .donut-legend .drow{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;gap:8px;}
  .donut-legend .dname{display:flex;align-items:center;gap:6px;color:var(--ink-soft);white-space:nowrap;}
  .donut-legend .dname i{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0;}
  .donut-legend .dval{font-weight:700;color:var(--ink);white-space:nowrap;}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-box{background:var(--paper-deep);border-radius:10px;padding:10px 12px;}
  .stat-box .slabel{font-size:10.5px;color:var(--ink-faint);font-weight:700;margin-bottom:4px;}
  .stat-box .sval{font-size:15px;font-weight:800;}

  .toggle{position:relative;width:42px;height:24px;border-radius:999px;background:var(--line);
    border:none;cursor:pointer;flex-shrink:0;padding:0;}
  .toggle.on{background:var(--mint);}
  .toggle .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;
    transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,0.2);}
  .toggle.on .knob{left:20px;}
  .field-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;}
  .field-row label{font-size:13px;font-weight:700;color:var(--ink);}
  .field-row .fr-desc{font-size:11px;color:var(--ink-faint);margin-top:2px;}

  /* Record tab */
  .month-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;}
  .month-scroll::-webkit-scrollbar{display:none;}
  .mchip{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap;cursor:pointer;}
  .mchip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .mchip.newm{border-style:dashed;color:var(--seal);border-color:var(--seal-soft);}

  .owner-group{margin-bottom:14px;}
  .owner-group h4{font-size:12px;font-weight:800;color:var(--ink-soft);letter-spacing:1px;
    margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;}
  .owner-group h4 .gtotal{color:var(--ink);font-size:13px;}
  .entry-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line-soft);
    border-radius:10px;padding:10px 12px;margin-bottom:7px;}
  .entry-row .tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;flex-shrink:0;}
  .tag.avail{background:var(--mint-soft);color:var(--mint);}
  .tag.unavail{background:#EAE6D8;color:var(--ink-faint);}
  .tag.none{background:transparent;color:var(--ink-faint);}
  .entry-mid{flex:1;min-width:0;}
  .entry-mid .cat{font-size:13px;font-weight:700;color:var(--ink);}
  .entry-mid .det{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry-amt{font-size:14.5px;font-weight:700;flex-shrink:0;}
  .entry-del{width:22px;height:22px;flex-shrink:0;border-radius:50%;border:none;background:transparent;
    color:var(--ink-faint);font-size:16px;cursor:pointer;}

  .row-actions{display:flex;gap:8px;margin:14px 0 4px;}
  .btn{border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn.primary{background:var(--ink);color:#fff;flex:1;}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .btn.seal{background:var(--seal);color:#fff;}
  .btn.block{width:100%;}
  .btn.small{padding:9px 12px;font-size:12.5px;}
  .btn.danger-ghost{background:transparent;color:var(--seal);border:1px solid var(--seal-soft);}

  .fab{position:fixed;right:0;bottom:78px;left:0;max-width:520px;margin:0 auto;pointer-events:none;
    display:flex;justify-content:flex-end;padding:0 20px;}
  .fab button{pointer-events:auto;background:var(--seal);color:#fff;border:none;border-radius:999px;
    width:54px;height:54px;font-size:26px;box-shadow:0 6px 16px rgba(178,58,46,0.35);cursor:pointer;}

  /* Trend */
  .trend-item{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;
    border-bottom:1px solid var(--line-soft);}
  .trend-item:last-child{border-bottom:none;}
  .trend-item .tm{font-size:13.5px;font-weight:700;}
  .trend-item .tv{text-align:right;}
  .trend-item .tv .amt{font-size:14px;font-weight:800;}
  .trend-item .tv .d{font-size:11px;}
  canvas#chart{width:100%;height:180px;display:block;}

  /* Export */
  textarea.mono{width:100%;min-height:110px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:11.5px;background:var(--paper-deep);border:1px solid var(--line);border-radius:10px;
    padding:10px;color:var(--ink);resize:vertical;}
  .merge-report{font-size:13px;background:var(--mint-soft);color:var(--mint);border-radius:8px;
    padding:10px 12px;margin-top:8px;font-weight:700;}
  .merge-report.err{background:var(--seal-soft);color:var(--seal);}

  /* Bottom nav */
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;max-width:520px;margin:0 auto;z-index:20;padding-bottom:env(safe-area-inset-bottom);}
  nav.bottom button{flex:1;background:none;border:none;padding:11px 4px 9px;display:flex;flex-direction:column;
    align-items:center;gap:4px;color:var(--ink-faint);font-size:10.5px;font-weight:700;cursor:pointer;}
  nav.bottom button.active{color:var(--seal);}
  nav.bottom svg{width:20px;height:20px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(27,42,74,0.4);z-index:50;display:flex;align-items:flex-end;
    opacity:0;pointer-events:none;transition:opacity .2s;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .sheet{background:var(--paper);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease;
    max-height:86vh;overflow-y:auto;}
  .overlay.show .sheet{transform:translateY(0);}
  .sheet h3{margin:0 0 16px;font-size:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    background:#fff;font-size:14.5px;color:var(--ink);font-family:inherit;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;padding:10px;border-radius:9px;border:1px solid var(--line);background:#fff;
    font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .seg button.on{background:var(--ink);border-color:var(--ink);color:#fff;}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) scale(0.9);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:100;opacity:0;
    transition:all .25s;display:flex;align-items:center;gap:7px;}
  .toast.show{opacity:1;transform:translateX(-50%) scale(1);}
  .toast .st{width:16px;height:16px;border:1.5px solid var(--seal);border-radius:50%;color:var(--seal);
    display:flex;align-items:center;justify-content:center;font-size:10px;background:#fff;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1><small>Household Asset Ledger</small>자산장부</h1>
      <div class="profile-chip" onclick="openProfileEdit()"><span class="dot"></span><span id="profileLabel">설정중</span></div>
    </div>
  </header>

  <main>
    <div class="tab active" id="tab-home"></div>
    <div class="tab" id="tab-record"></div>
    <div class="tab" id="tab-trend"></div>
    <div class="tab" id="tab-export"></div>
  </main>

  <div class="fab" id="fab" style="display:none;"><button onclick="openEntryModal()">+</button></div>

  <nav class="bottom">
    <button class="active" data-tab="home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      홈
    </button>
    <button data-tab="record" onclick="switchTab('record')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      기록
    </button>
    <button data-tab="trend" onclick="switchTab('trend')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9m6 10V4m6 15v-7"/></svg>
      추이
    </button>
    <button data-tab="export" onclick="switchTab('export')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
      내보내기
    </button>
  </nav>
</div>

<div class="overlay" id="entryOverlay">
  <div class="sheet">
    <h3 id="entryModalTitle">항목 추가</h3>
    <div class="field">
      <label>이름</label>
      <input id="f_owner" list="ownerList" placeholder="예: 준수">
      <datalist id="ownerList"></datalist>
    </div>
    <div class="field">
      <label>종류</label>
      <select id="f_category" onchange="handleCategoryChange()">
        <option>적금</option><option>예금</option><option>입출금</option><option>펀드</option>
        <option>주식</option><option>연금</option><option>환전</option><option>청약</option><option>기타</option>
      </select>
    </div>
    <div class="field">
      <label>가용 / 미가용</label>
      <div class="seg">
        <button type="button" id="seg_avail" onclick="setAvail('가용')">가용</button>
        <button type="button" id="seg_unavail" onclick="setAvail('미가용')">미가용</button>
        <button type="button" id="seg_none" onclick="setAvail('')">해당없음</button>
      </div>
    </div>
    <div class="field">
      <label>은행명</label>
      <input id="f_bank" placeholder="예: 국민은행">
    </div>
    <div class="field">
      <label>세부내역</label>
      <input id="f_detail" placeholder="예: 주택청약">
    </div>
    <div class="field" id="amountFieldWrap">
      <label>금액 (원)</label>
      <input id="f_amount" type="text" inputmode="numeric" placeholder="0">
    </div>
    <div id="stockFieldsWrap" style="display:none;">
      <div class="field">
        <label>1주당 가격 (원)</label>
        <input id="f_price" type="text" inputmode="numeric" placeholder="0">
      </div>
      <div class="field">
        <label>보유 주식 수</label>
        <input id="f_shares" type="text" inputmode="numeric" placeholder="0">
      </div>
      <div class="field">
        <label>계산된 금액</label>
        <div style="font-size:17px;font-weight:800;color:var(--ink);padding:9px 2px;" id="stockPreview" class="num">0원</div>
      </div>
    </div>
    <div class="row-actions">
      <button class="btn ghost" style="flex:1" onclick="closeEntryModal()">취소</button>
      <button class="btn primary" onclick="saveEntry()">저장</button>
    </div>
    <button class="btn danger-ghost block" id="deleteEntryBtn" style="display:none;margin-top:8px;" onclick="deleteCurrentEntry()">이 항목 삭제</button>
  </div>
</div>

<div class="overlay" id="profileOverlay">
  <div class="sheet">
    <h3>설정</h3>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-8px;line-height:1.6;">
      기록할 때 기본으로 들어갈 이름이에요. 배우자와 각자 기기에서 따로 기록한 뒤,
      내보내기 탭에서 합칠 수 있어요.
    </p>
    <div class="field">
      <label>이름</label>
      <input id="f_profile" placeholder="예: 준수">
    </div>
    <div class="field">
      <label>목표 금액 (원 · 전체 합계 기준)</label>
      <input id="f_goal" type="text" inputmode="numeric" placeholder="예: 100,000,000">
    </div>
    <div class="field-row">
      <div>
        <label>월말 기록 알림</label>
        <div class="fr-desc">매달 하순에 앱을 열면 기록 여부를 알려줘요</div>
      </div>
      <button type="button" class="toggle" id="notifyToggle" onclick="toggleNotify()"><span class="knob"></span></button>
    </div>
    <button class="btn primary block" onclick="saveProfile()">저장</button>
  </div>
</div>

<div class="overlay" id="newMonthOverlay">
  <div class="sheet">
    <h3>새 달 시작</h3>
    <div class="field">
      <label>기록할 달</label>
      <input id="f_newmonth" type="month">
    </div>
    <div class="row-actions">
      <button class="btn ghost" style="flex:1" onclick="closeNewMonth()">취소</button>
      <button class="btn primary" onclick="createMonth(true)">지난달 항목 불러와서 시작</button>
    </div>
    <button class="btn ghost block" style="margin-top:8px;" onclick="createMonth(false)">빈 달로 시작</button>
  </div>
</div>

<div class="toast" id="toast"><span class="st">✓</span><span id="toastMsg">저장됨</span></div>

<script>
const CATS = ['적금','예금','입출금','펀드','주식','연금','환전','청약','기타'];
const CAT_COLORS = {
  '적금':'#2F6F5E','예금':'#3F8A76','입출금':'#B5872F','펀드':'#8C6A2E',
  '주식':'#B23A2E','연금':'#6B5A8E','환전':'#4C5A78','청약':'#1B2A4A','기타':'#93998B'
};
let state = { profile:{name:''}, snapshots:{}, goal:{amount:0}, notifyEnabled:false, lastNotifiedDate:'' };
let curTab = 'home';
let curMonth = null;
let editingEntryId = null;
let curAvail = '가용';
let bannerDismissedThisSession = false;

function fmt(n){ return (n||0).toLocaleString('ko-KR'); }
function parseNum(str){ return Number((str||'').toString().replace(/[^\d]/g,'')) || 0; }
function setFormatted(id, num){
  const el = document.getElementById(id);
  el.value = num ? Number(num).toLocaleString('ko-KR') : '';
}
function attachNumberFormatting(id, onInput){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', ()=>{
    const raw = parseNum(el.value);
    el.value = raw ? raw.toLocaleString('ko-KR') : '';
    if(onInput) onInput();
  });
}
function toast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function withRetry(fn, tries){
  tries = tries || 3;
  let lastErr;
  for(let i=0;i<tries;i++){
    try{ return await fn(); }
    catch(e){ lastErr = e; await sleep(300*(i+1)); }
  }
  throw lastErr;
}

/* Storage abstraction: Claude 아티팩트 안에서는 window.storage(클라우드 저장)를 쓰고,
   GitHub/Vercel 등 자체 호스팅 사이트로 열었을 때는 window.storage가 없으므로
   브라우저 localStorage로 자동 전환해서 저장이 항상 되도록 함 */
const hasArtifactStorage = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';
async function storageGet(key){
  if(hasArtifactStorage){
    return await window.storage.get(key, false);
  }
  const raw = localStorage.getItem(key);
  return raw !== null ? {value: raw} : null;
}
async function storageSet(key, value){
  if(hasArtifactStorage){
    return await window.storage.set(key, value, false);
  }
  localStorage.setItem(key, value);
  return {value};
}

async function loadState(){
  try{
    const r = await withRetry(()=>storageGet('assetData'));
    if(r && r.value){ state = JSON.parse(r.value); }
  }catch(e){ /* no data yet, or storage unavailable — start empty */ }
  if(!state.snapshots) state.snapshots = {};
  if(!state.profile) state.profile = {name:''};
  if(!state.goal) state.goal = {amount:0};
  if(state.notifyEnabled === undefined) state.notifyEnabled = false;
  if(state.lastNotifiedDate === undefined) state.lastNotifiedDate = '';
}

let saveQueued = false;
async function saveState(){
  try{
    await withRetry(()=>storageSet('assetData', JSON.stringify(state)));
  }catch(e){
    console.error('저장 실패', e);
    toast('저장이 지연되고 있어요. 잠시 후 자동으로 다시 시도해요');
    if(!saveQueued){
      saveQueued = true;
      setTimeout(async ()=>{
        saveQueued = false;
        try{ await withRetry(()=>storageSet('assetData', JSON.stringify(state))); toast('저장됨'); }
        catch(e2){ console.error('재시도 실패', e2); }
      }, 2500);
    }
  }
}

function monthKeysDesc(){
  return Object.keys(state.snapshots).sort().reverse();
}
function ownersInMonth(mk){
  const set = new Set();
  (state.snapshots[mk]||[]).forEach(e=>set.add(e.owner||'미지정'));
  return [...set];
}
function allOwnersEver(){
  const set = new Set();
  Object.values(state.snapshots).forEach(list=>list.forEach(e=>set.add(e.owner||'미지정')));
  if(state.profile.name) set.add(state.profile.name);
  return [...set];
}
function totalsForMonth(mk){
  const list = state.snapshots[mk]||[];
  const byOwner = {};
  let avail=0, unavail=0;
  list.forEach(e=>{
    const o = e.owner||'미지정';
    if(!byOwner[o]) byOwner[o]={avail:0,unavail:0,total:0};
    const amt = Number(e.amount)||0;
    byOwner[o].total += amt;
    if(e.avail==='가용'){ byOwner[o].avail += amt; avail += amt; }
    else if(e.avail==='미가용'){ byOwner[o].unavail += amt; unavail += amt; }
  });
  const grand = Object.values(byOwner).reduce((s,o)=>s+o.total,0);
  return {byOwner, avail, unavail, grand};
}

/* ---------- Reminder ---------- */
function currentYm(){
  const now = new Date();
  return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function shouldRemind(){
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const isLateMonth = now.getDate() >= (daysInMonth-6);
  return isLateMonth && !state.snapshots[currentYm()];
}
async function maybeNotify(){
  if(!state.notifyEnabled) return;
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  if(!shouldRemind()) return;
  if(state.lastNotifiedDate === todayISO()) return;
  try{
    new Notification('자산장부', { body: '이번 달 자산 기록을 아직 안 하셨어요. 지금 기록해볼까요?' });
    state.lastNotifiedDate = todayISO();
    await saveState();
  }catch(e){ /* 알림 생성 실패는 조용히 무시 */ }
}

/* ---------- Category / Donut ---------- */
function categoryTotalsForMonth(mk){
  const list = state.snapshots[mk]||[];
  const sums = {};
  list.forEach(e=>{
    const amt = Number(e.amount)||0;
    sums[e.category] = (sums[e.category]||0) + amt;
  });
  return sums;
}
function drawDonut(sums, total){
  const cv = document.getElementById('donutChart');
  if(!cv) return;
  const dpr = window.devicePixelRatio||1;
  const size = 110;
  cv.width = size*dpr; cv.height = size*dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,size,size);
  if(!total){
    ctx.strokeStyle = '#DFD9C7'; ctx.lineWidth = size*0.2;
    ctx.beginPath(); ctx.arc(size/2,size/2,(size-ctx.lineWidth)/2,0,Math.PI*2); ctx.stroke();
    return;
  }
  const cx=size/2, cy=size/2, rOuter=size/2-3, rInner=rOuter*0.58;
  let start = -Math.PI/2;
  Object.keys(sums).forEach(cat=>{
    const frac = sums[cat]/total;
    const end = start + frac*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rOuter,start,end);
    ctx.closePath();
    ctx.fillStyle = CAT_COLORS[cat] || '#93998B';
    ctx.fill();
    start = end;
  });
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath(); ctx.arc(cx,cy,rInner,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
}

/* ---------- Growth stats ---------- */
function growthStats(monthsAsc){
  if(monthsAsc.length<2) return null;
  const totals = monthsAsc.map(mk=>totalsForMonth(mk).grand);
  const first = totals[0], last = totals[totals.length-1];
  const avgChange = (last-first)/(monthsAsc.length-1);
  const totalGrowthPct = first ? ((last-first)/Math.abs(first))*100 : null;
  const recentN = Math.min(3, monthsAsc.length-1);
  const recentStart = totals[totals.length-1-recentN];
  const recentAvg = (last-recentStart)/recentN;
  return {avgChange, totalGrowthPct, recentAvg, recentN};
}

          <div class="stat-box"><div class="slabel">최근 ${stats.recentN}개월 평균</div><div class="sval num">${fmt(Math.round(stats.recentAvg))}원</div></div>
          <div class="stat-box"><div class="slabel">전체 증가율</div><div class="sval num">${stats.totalGrowthPct!==null ? stats.totalGrowthPct.toFixed(1)+'%' : '-'}</div></div>
          <div class="stat-box"><div class="slabel">기록 개월 수</div><div class="sval num">${months.length}개월</div></div>
        </div>
      </div>`;
  }
  el.innerHTML = `
    ${statsHtml}
    <div class="card"><canvas id="chart"></canvas></div>
    <div class="card"><div class="card-title">월별 총자산</div><div id="trendList"></div></div>
  `;
  drawChart(months);
  const listEl = document.getElementById('trendList');
  const descMonths = [...months].reverse();
  listEl.innerHTML = descMonths.map((mk,i)=>{
    const t = totalsForMonth(mk);
    const prevMk = descMonths[i+1];
    let dHtml = '';
    if(prevMk){
      const diff = t.grand - totalsForMonth(prevMk).grand;
      const cls = diff>0?'up':diff<0?'down':'flat';
      const arrow = diff>0?'▲':diff<0?'▼':'—';
      dHtml = `<div class="d ${cls} num">${arrow} ${fmt(Math.abs(diff))}</div>`;
    }
    return `<div class="trend-item"><div class="tm">${mk}</div><div class="tv"><div class="amt num">${fmt(t.grand)}원</div>${dHtml}</div></div>`;
  }).join('');
}
function drawChart(months){
  const cv = document.getElementById('chart');
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth||300, h=180;
  cv.width = w*dpr; cv.height = h*dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const totals = months.map(mk=>totalsForMonth(mk).grand);
  const max = Math.max(...totals,1), min = Math.min(...totals,0);
  const pad = 24;
  const xstep = months.length>1 ? (w-pad*2)/(months.length-1) : 0;
  const scaleY = v => h-pad - ((v-min)/(max-min||1))*(h-pad*2);

  ctx.strokeStyle = '#CDC5AE'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad, h-pad); ctx.lineTo(w-pad, h-pad); ctx.stroke();

  ctx.strokeStyle = '#B23A2E'; ctx.lineWidth=2.2; ctx.beginPath();
  totals.forEach((v,i)=>{
    const x = pad + i*xstep, y = scaleY(v);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  totals.forEach((v,i)=>{
    const x = pad + i*xstep, y = scaleY(v);
    ctx.fillStyle='#B23A2E'; ctx.beginPath(); ctx.arc(x,y,3.2,0,7); ctx.fill();
  });
  ctx.fillStyle = '#5A6685'; ctx.font='10px -apple-system,sans-serif'; ctx.textAlign='center';
  months.forEach((mk,i)=>{
    if(months.length>6 && i%2!==0 && i!==months.length-1) return;
    const x = pad + i*xstep;
    ctx.fillText(mk.slice(2), x, h-6);
  });
}

/* ---------- Export / Import ---------- */
function renderExport(){
  const el = document.getElementById('tab-export');
  const exportObj = { exportedBy: state.profile.name||'', snapshots: state.snapshots };
  const json = JSON.stringify(exportObj);
  el.innerHTML = `
    <div class="card">
      <div class="card-title">내 기록 내보내기</div>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-top:0;line-height:1.6;">
        아래 텍스트를 복사해서 배우자에게 보내주세요. 배우자는 이 텍스트를 아래 "합치기"에 붙여넣으면 됩니다.
      </p>
      <textarea class="mono" readonly id="exportBox">${json}</textarea>
      <button class="btn seal block" style="margin-top:10px;" onclick="copyExport()">복사하기</button>
    </div>
    <div class="card">
      <div class="card-title">받은 기록 합치기</div>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-top:0;line-height:1.6;">
        배우자에게 받은 텍스트를 붙여넣으면 같은 항목은 건너뛰고 새 항목만 더해져요.
      </p>
      <textarea class="mono" id="importBox" placeholder="여기에 붙여넣기"></textarea>
      <button class="btn primary block" style="margin-top:10px;" onclick="mergeImport()">합치기</button>
      <div id="mergeResult"></div>
    </div>
  `;
}
async function copyExport(){
  const box = document.getElementById('exportBox');
  box.select(); box.setSelectionRange(0,999999);
  try{ await navigator.clipboard.writeText(box.value); toast('복사됨'); }
  catch(e){ toast('복사에 실패했어요. 직접 선택해 복사해주세요'); }
}
async function mergeImport(){
  const raw = document.getElementById('importBox').value.trim();
  const resEl = document.getElementById('mergeResult');
  if(!raw){ resEl.innerHTML = `<div class="merge-report err">붙여넣을 내용이 없어요</div>`; return; }
  let obj;
  try{ obj = JSON.parse(raw); }
  catch(e){ resEl.innerHTML = `<div class="merge-report err">텍스트를 읽을 수 없어요. 전체 내용을 정확히 붙여넣었는지 확인해주세요</div>`; return; }
  const incoming = obj.snapshots || obj;
  if(typeof incoming !== 'object'){ resEl.innerHTML = `<div class="merge-report err">알 수 없는 형식이에요</div>`; return; }

  let added=0, skipped=0;
  Object.keys(incoming).forEach(mk=>{
    if(!state.snapshots[mk]) state.snapshots[mk]=[];
    const existingKeys = new Set(state.snapshots[mk].map(e=>[e.owner,e.category,e.bank,e.detail].join('|')));
    (incoming[mk]||[]).forEach(e=>{
      const key = [e.owner,e.category,e.bank,e.detail].join('|');
      if(existingKeys.has(key)){ skipped++; return; }
      state.snapshots[mk].push({...e, id: genId()});
      existingKeys.add(key);
      added++;
    });
  });
  await saveState();
  resEl.innerHTML = `<div class="merge-report">${added}개 추가, ${skipped}개는 이미 있어서 건너뜀</div>`;
  document.getElementById('importBox').value='';
  render();
}

/* ---------- Render dispatcher ---------- */
function render(){
  document.getElementById('profileLabel').textContent = state.profile.name || '이름 설정';
  if(curTab==='home') renderHome();
  if(curTab==='record') renderRecord();
  if(curTab==='trend') renderTrend();
  if(curTab==='export') renderExport();
  document.getElementById('fab').style.display = (curTab==='record' && curMonth) ? 'flex' : 'none';
}

/* ---------- Init ---------- */
(async function init(){
  await loadState();
  if(!state.profile.name){
    setTimeout(()=>{ document.getElementById('profileOverlay').classList.add('show'); }, 250);
  }
  const months = monthKeysDesc();
  curMonth = months[0] || null;
  attachNumberFormatting('f_amount');
  attachNumberFormatting('f_goal');
  attachNumberFormatting('f_price', updateStockPreview);
  attachNumberFormatting('f_shares', updateStockPreview);
  render();
  maybeNotify();
})();

</script>
